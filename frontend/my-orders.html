<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #74c947;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(22, 22, 22, 0.9);
            --text-gray: #a0a0a0;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh; 
            color: white;
        }

        /* Floating Back Icon (Top Left) */
        .btn-back-top {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            z-index: 1001;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 80px 15px 30px; 
        }

        h2 { 
            text-align: center; 
            font-size: 22px; 
            color: var(--primary); 
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 25px;
            font-weight: 800;
        }

        /* Order Card - Phone Optimized */
        .order-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.05);
            display: flex; 
            align-items: center; 
            gap: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        .order-card img { 
            width: 80px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 12px; 
            border: 1px solid #333;
        }
        
        .order-info { flex-grow: 1; }
        .order-info h3 { margin: 0 0 5px 0; font-size: 16px; color: #fff; }
        .order-info p { margin: 2px 0; color: var(--text-gray); font-size: 13px; }
        
        /* Status Badges */
        .status-badge { 
            padding: 4px 10px; 
            border-radius: 8px; 
            font-size: 11px; 
            font-weight: bold; 
            display: inline-block; 
            margin-top: 8px;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid rgba(255, 193, 7, 0.3); }
        .status-delivered { background: rgba(116, 201, 71, 0.2); color: var(--primary); border: 1px solid rgba(116, 201, 71, 0.3); }
        
        .empty-msg { 
            text-align: center; 
            padding: 50px 20px; 
            background: var(--card-bg);
            border-radius: 20px;
            color: var(--text-gray); 
        }

        .continue-btn { 
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<a href="view.html" class="btn-back-top"><i class="fas fa-arrow-left"></i></a>

<div class="container">
    <h2><i class="fas fa-history"></i> My Orders</h2>
    
    <div id="ordersList">
        <div class="empty-msg">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 30px; color: var(--primary);"></i>
            <p>Fetching your orders...</p>
        </div>
    </div>

    <a href="view.html" class="continue-btn">Continue Shopping</a>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    
    if(!user) {
        window.location.href = "index1.html";
    }

    function fetchOrders() {
        fetch(`https://citysho.onrender.com/my-orders/${user.id}`)
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById("ordersList");
            list.innerHTML = "";

            const orders = data.orders || data;

            if(!orders || orders.length === 0) {
                list.innerHTML = `
                    <div class="empty-msg">
                        <i class="fas fa-box-open" style="font-size: 50px; margin-bottom: 15px; color: #444;"></i>
                        <p>No orders found yet.</p>
                    </div>`;
                return;
            }

            orders.forEach(order => {
                const statusClass = order.status === 'Pending' ? 'status-pending' : 'status-delivered';
                const imgPath = order.image ? `https://citysho.onrender.com/uploads/${order.image}` : 'https://via.placeholder.com/80?text=Agro';

                list.innerHTML += `
                    <div class="order-card">
                        <img src="${imgPath}" onerror="this.src='https://via.placeholder.com/80?text=Agro'" alt="Product">
                        <div class="order-info">
                            <h3>${order.product_name}</h3>
                            <p><strong>ID:</strong> #${order.id}</p>
                            <p><strong>Total:</strong> ₹${parseFloat(order.price).toFixed(2)}</p>
                            <p><strong>Date:</strong> ${new Date(order.order_date).toLocaleDateString()}</p>
                            <span class="status-badge ${statusClass}">${order.status}</span>
                        </div>
                    </div>
                `;
            });
        })
        .catch(err => {
            document.getElementById("ordersList").innerHTML = "<div class='empty-msg'>Connection Error!</div>";
        });
    }

    fetchOrders();
</script>

</body>
</html>
