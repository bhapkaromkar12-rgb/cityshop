<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Agro City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #74c947;
            --dark-card: rgba(15, 15, 15, 0.85);
            --border-glow: rgba(116, 201, 71, 0.3);
        }

        body { 
            margin:0; 
            font-family: 'Inter', sans-serif; 
            /* Aapki mangi hui background setting */
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            color: white;
        }
        
        /* Glassmorphism Navbar */
        .navbar { 
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            padding: 15px 0%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }

        .logo { font-size: 20px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--primary); }
        .logo span { font-size: 12px; background: var(--primary); color: black; padding: 2px 8px; border-radius: 4px; margin-left: 5px; }

        /* Form Container */
        .container { 
            width: 90%; 
            max-width: 450px; 
            margin: auto; 
            background: var(--dark-card); 
            backdrop-filter: blur(20px);
            padding: 40px; 
            border-radius: 25px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 50px;
            margin-bottom: 50px;
        }

        h2 { text-align: center; margin-bottom: 30px; font-size: 26px; text-transform: uppercase; letter-spacing: 2px; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group i { position: absolute; left: 15px; top: 16px; color: var(--primary); }

        input { 
            width: 100%; 
            padding: 15px 15px 15px 45px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; 
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .file-label {
            display: block; font-size: 13px; color: #bbb; margin: 15px 0 8px 5px; font-weight: 600;
        }

        input[type="file"] {
            padding: 12px; background: rgba(116, 201, 71, 0.05); border: 1px dashed var(--primary); cursor: pointer;
        }

        .submit-btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 18px; 
            font-weight: 800;
            margin-top: 20px;
            transition: 0.4s;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
        }

        .submit-btn:hover { background: #5ea33a; transform: translateY(-3px); box-shadow: 0 15px 25px rgba(116, 201, 71, 0.4); }

        /* Admin Profile Dropdown */
        .profile-container { 
    position: relative;
    margin-right: 10px; /* Thoda sa gap edge se */
}
        .profile-btn { 
            background: rgba(255,255,255,0.1); 
            color: white; 
            border: 1px solid rgba(255,255,255,0.2); 
            padding: 10px 18px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold;
            display: flex; align-items: center; gap: 8px;
        }
        
        .dropdown-content {
            display: none; position: absolute; right: 0; background: #1a1a1a; min-width: 200px; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5); z-index: 100; border-radius: 15px; 
            margin-top: 10px; overflow: hidden; border: 1px solid #333;
        }
        
        .dropdown-content p { margin: 0; padding: 15px; background: #222; font-size: 12px; color: #888; border-bottom: 1px solid #333; }
        .dropdown-content a { color: #eee; padding: 12px 20px; text-decoration: none; display: block; font-size: 14px; transition: 0.3s; }
        .dropdown-content a:hover { background: #252525; color: var(--primary); }
        .show { display: block; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo"><i class="fas fa-tools"></i> AGRO SHOP <span>ADMIN</span></div>
    
    <div class="profile-container">
        <button class="profile-btn" onclick="toggleDropdown()">
            <i class="fas fa-user-shield"></i> 
            <span id="adminNameDisplay">Master</span>
        </button>
        <div id="profileDropdown" class="dropdown-content">
            <p id="adminEmail">admin@cityshop.com</p>
            <a href="admin_dash.html"><i class="fas fa-chart-line"></i> Dashboard</a> 
            <a href="all-orders.html"><i class="fas fa-shopping-basket"></i> View Orders</a> 
            <a href="edit-profile.html"><i class="fas fa-user-cog"></i> Settings</a> 
            <a href="#" onclick="logout()" style="color: #ff5f5f;"><i class="fas fa-power-off"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2>Add New Product</h2>
    <form id="productForm">
        <div class="input-group">
            <i class="fas fa-tag"></i>
            <input type="text" name="name" placeholder="Product Name" required>
        </div>
        
        <div class="input-group">
            <i class="fas fa-rupee-sign"></i>
            <input type="number" name="price" placeholder="Price (₹)" required>
        </div>

        <div class="input-group">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" name="city" placeholder="City Name" required>
        </div>

        <div class="input-group">
            <i class="fas fa-boxes"></i>
            <input type="number" name="quantity" placeholder="Stock Quantity" required>
        </div>
        
        <label class="file-label">Product Showcase Image</label>
        <input type="file" name="image" accept="image/*" required>
        
        <button type="submit" class="submit-btn">Publish Product</button>
    </form>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("user"));
    if(!user || user.role !== "admin"){
        alert("Admin Access Required!");
        window.location.href = "index1.html";
    } else {
        document.getElementById("adminNameDisplay").innerText = user.username;
        document.getElementById("adminEmail").innerText = user.email;
    }

    function toggleDropdown() {
        document.getElementById("profileDropdown").classList.toggle("show");
    }

    function logout() {
        localStorage.removeItem("user");
        window.location.href = "index1.html";
    }

    window.onclick = function(event) {
        if (!event.target.closest('.profile-container')) {
            document.getElementById("profileDropdown").classList.remove("show");
        }
    }

    document.getElementById("productForm").addEventListener("submit", function(e){
        e.preventDefault();
        const btn = this.querySelector('.submit-btn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        let formData = new FormData(this);

        fetch("https://cityshobackend.onrender.com/add-product", {
            method: "POST",
            body: formData
        })
        .then(res => res.text())
        .then(data => {
            alert(data);
            btn.innerText = "Publish Product";
            btn.disabled = false;
            if(data.toLowerCase().includes("success")) this.reset();
        })
        .catch(err => {
            alert("Server Error!");
            btn.innerText = "Publish Product";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
