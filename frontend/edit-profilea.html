<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin:0; font-family:sans-serif; background: linear-gradient(135deg, #2ae7bb, #ff7eb3); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .profile-card { background: white; width: 90%; max-width: 380px; padding: 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; margin-left: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #eee; border-radius: 12px; box-sizing: border-box; background: #f9f9f9; font-size: 15px; }
        .save-btn { width: 100%; padding: 15px; background: #26d7c5; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .save-btn:hover { background: #1fbba9; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #888; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="profile-card">
    <h2><i class="fas fa-user-edit"></i> Edit Profile</h2>
    <form id="profileForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="username" required>
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" required>
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="Enter phone number">
        </div>
        <div class="input-group">
            <label>New Password (Leave blank to keep same)</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button type="submit" class="save-btn">Update Profile</button>
        <a href="#" id="backBtn" class="back-link">Cancel</a>
    </form>
</div>

<script>
    // 1. Current user data load karna
    const user = JSON.parse(localStorage.getItem("user"));
    if(!user) window.location.href = "index.html";

    document.getElementById("username").value = user.username;
    document.getElementById("email").value = user.email;
    document.getElementById("phone").value = user.phone || "";

    // Back button setup (Admin ko Admin Dash par, User ko View Products par)
    const backBtn = document.getElementById("backBtn");
    backBtn.href = user.role === 'admin' ? 'add-product.html' : 'view.html';

    // 2. Profile Update Submit
    document.getElementById("profileForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const updatedData = {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            password: document.getElementById("password").value
        };

        fetch(`https://cityshobackend.onrender.com/update-profile/${user.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        })
        .then(res => res.json())
        .then(data => {
            alert(data.message);
            // LocalStorage update karein taaki navbar mein naya naam dikhe
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = backBtn.href;
        })
        .catch(err => alert("Update failed!"));
    });
</script>
</body>
</html>
