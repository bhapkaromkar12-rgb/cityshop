<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #26d7c5;
            --secondary: #667eea;
            --bg-gradient: linear-gradient(135deg, #2ae7bb, #ff7eb3);
        }

        body { 
            margin:0; 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        .profile-card { 
            background: white; 
            width: 90%; 
            max-width: 400px; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.25); 
            position: relative;
            overflow: hidden;
        }

        /* Decorative top bar */
        .profile-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }

        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 25px; 
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        h2 i { color: var(--primary); margin-right: 10px; }

        .input-group { margin-bottom: 18px; position: relative; }

        label { 
            display: block; 
            font-size: 12px; 
            color: #888; 
            margin-bottom: 6px; 
            margin-left: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        input { 
            width: 100%; 
            padding: 14px 18px; 
            border: 1px solid #f0f0f0; 
            border-radius: 15px; 
            box-sizing: border-box; 
            background: #fdfdfd; 
            font-size: 16px; 
            transition: all 0.3s ease;
            color: #444;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 5px 15px rgba(38, 215, 197, 0.1);
        }

        .save-btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 17px; 
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 10px 20px rgba(38, 215, 197, 0.3);
            transition: all 0.3s ease;
        }

        .save-btn:active { transform: scale(0.97); }

        .save-btn:hover { background: #1fbba9; transform: translateY(-2px); }

        .back-link { 
            display: block; 
            text-align: center; 
            margin-top: 20px; 
            color: #aaa; 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 500;
            transition: 0.3s;
        }

        .back-link:hover { color: #ff7eb3; }

        /* Animation for card entry */
        .profile-card {
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="profile-card">
    <h2><i class="fas fa-id-card"></i> EditProfile </h2>
    
    <form id="profileForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="username" placeholder="Your Name" required>
        </div>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="+91 XXXXX XXXXX">
        </div>
        
        <div class="input-group">
            <label>New Password (Leave blank to keep same )</label>
            <input type="password" id="password" placeholder="Leave empty if no change">
        </div>
        
        <button type="submit" class="save-btn">Update Profile</button>
       <a href="#" id="backBtn" class="back-link"><i class="fas fa-arrow-left"></i>Cancel</a>
    </form>
</div>

<script>
    // 1. Current user data load karna
    const user = JSON.parse(localStorage.getItem("user"));
    if(!user) {
        window.location.href = "index1.html";
    } else {
        document.getElementById("username").value = user.username;
        document.getElementById("email").value = user.email;
        document.getElementById("phone").value = user.phone || "";
    }

    // Dynamic Navigation
    const backBtn = document.getElementById("backBtn");
    backBtn.href = user.role === 'admin' ? 'add-product.html' : 'view.html';

    // 2. Update Submit Logic
    document.getElementById("profileForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const saveBtn = e.target.querySelector('.save-btn');
        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        const updatedData = {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            password: document.getElementById("password").value
        };

        fetch(`https://cityshobackend.onrender.com/update-profile/${admin.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        })
        .then(res => res.json())
        .then(data => {
            alert("Success! " + data.message);
            localStorage.setItem("user", JSON.stringify(data.user));
            window.location.href = backBtn.href;
        })
        .catch(err => {
            alert("Something went wrong!");
            saveBtn.innerText = "Update Profile";
            saveBtn.disabled = false;
        });
    });
</script>
</body>
</html>
