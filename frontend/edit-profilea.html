<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090d09">
    <title>Settings - AgroTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    :root {
        --primary: #74c947;
        --dark-card: rgba(18, 18, 18, 0.9);
        --text-gray: #b0b0b0;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(rgba(0,0,0,0.72), rgba(0,0,0,0.62)),
                    url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=1400');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        color: white;
        padding: 60px 16px 30px;
        padding-bottom: calc(30px + env(safe-area-inset-bottom));
        -webkit-text-size-adjust: 100%;
    }
    @media (min-height: 700px) { body { align-items: center; } }

    /* Floating Back Button (Left Top) */
    .btn-back-top {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        color: white;
        text-decoration: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255,255,255,0.2);
        transition: 0.3s;
        z-index: 10;
    }
    .btn-back-top:active { transform: scale(0.9); }

    .profile-card {
        background: var(--dark-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        width: 100%;
        max-width: 420px;
        padding: 30px 24px;
        border-radius: 22px;
        box-shadow: 0 22px 48px rgba(0,0,0,0.5);
        border: 1px solid rgba(255,255,255,0.1);
        animation: slideUp 0.5s ease-out;
    }
    @media (max-width: 480px) { .profile-card { padding: 22px 18px; border-radius: 16px; } }
    @media (max-width: 360px) { .profile-card { padding: 18px 14px; } }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 { 
        text-align: center; 
        font-size: 24px;
        margin-bottom: 30px; 
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 800;
    }

    .input-group { margin-bottom: 20px; }

    label { 
        display: block; 
        font-size: 11px; 
        color: var(--text-gray); 
        margin-bottom: 8px; 
        margin-left: 5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input {
        width: 100%;
        padding: 13px 16px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 12px;
        box-sizing: border-box;
        color: white;
        font-size: 16px; /* iOS zoom fix */
        transition: 0.3s;
        -webkit-appearance: none;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 15px rgba(116, 201, 71, 0.15);
    }

    .save-btn { 
        width: 100%; 
        padding: 16px; 
        background: var(--primary); 
        color: white; 
        border: none; 
        border-radius: 12px; 
        font-weight: 800; 
        font-size: 16px; 
        cursor: pointer; 
        margin-top: 10px; 
        box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.4s;
    }

    .save-btn:active { transform: scale(0.96); }

    /* Footer link */
   .back-link { 
    display: block; 
    text-align: center; /* Isse link center mein aa jayega */
    margin-top: 20px; 
    color: var(--text-gray); 
    text-decoration: none; 
    font-size: 14px; 
    font-weight: 500;
    transition: 0.3s;
}

.back-link i {
    margin-right: 8px; /* Icon aur text ke beech gap */
}

.back-link:hover { 
    color: var(--primary); 
}
    .cancel-link a {
        color: var(--text-gray);
        text-decoration: none;
        font-size: 13px;
    }
</style>
</head>
<body>
    <a href="admin.html" class="btn-back-top"><i class="fas fa-arrow-left"></i></a>

<div class="profile-card">
    <h2><i class="fas fa-id-card"></i> EditProfile </h2>
    
    <form id="profileForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="username" placeholder="Your Name" required>
        </div>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="email@example.com" required>
        </div>
        
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="phone" placeholder="+91 XXXXX XXXXX">
        </div>
        
        <div class="input-group">
            <label>New Password (Leave blank to keep same )</label>
            <input type="password" id="password" placeholder="Leave empty if no change">
        </div>
        
        <button type="submit" class="save-btn">Update Profile</button>
       <a href="admin.html" class="back-link"><i class="fas fa-arrow-left"></i> Cancel</a>

    </form>
</div>

<script>
    // Load user data
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) {
        window.location.href = "index1.html";
    } else {
        document.getElementById("username").value = user.username || "";
        document.getElementById("email").value = user.email || "";
        document.getElementById("phone").value = user.phone || "";
    }

    // Dynamic back navigation
    const backPath = user && (user.role === 'seller' || user.role === 'admin') ? 'admin.html' : 'view.html';
    document.querySelector('.btn-back-top').href = backPath;
    document.querySelector('.back-link').href = backPath;

    // Update submit
    document.getElementById("profileForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const saveBtn = this.querySelector('.save-btn');
        saveBtn.innerText = "Saving...";
        saveBtn.disabled = true;

        const updatedData = {
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            password: document.getElementById("password").value
        };

        fetch(`https://cityshobackend.onrender.com/update-profile/${user.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(updatedData)
        })
        .then(res => res.json())
        .then(data => {
            const newUser = { ...user, username: updatedData.username, email: updatedData.email, phone: updatedData.phone };
            localStorage.setItem("user", JSON.stringify(newUser));
            alert("Profile updated successfully!");
            window.location.href = backPath;
        })
        .catch(() => {
            alert("Server error! Please try again.");
            saveBtn.innerText = "Update Profile";
            saveBtn.disabled = false;
        });
    });
</script>
</body>
</html>
