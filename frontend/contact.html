<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AgroTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #74c947;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(22, 22, 22, 0.95);
            --text-gray: #a0a0a0;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* --- Floating Back Icon (Top Left) --- */
        .btn-back-top {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            z-index: 1000;
            transition: 0.3s;
        }
        .btn-back-top:hover {
            background: var(--primary-green);
            border-color: var(--primary-green);
            transform: scale(1.1);
        }

        /* --- Contact Box --- */
        .contact-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .contact-container h2 {
            font-size: 28px;
            color: var(--primary-green);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .contact-container p {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* --- Form Elements --- */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--primary-green);
            margin-bottom: 5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        input, textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            background: rgba(255, 255, 255, 0.08);
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .btn-submit {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(116, 201, 71, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.95);
        }

        /* --- Social Info --- */
        .contact-info {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 25px;
        }

        .info-item {
            color: var(--text-gray);
            font-size: 18px;
            transition: 0.3s;
        }

        .info-item:hover {
            color: var(--primary-green);
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back-top">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="contact-container">
        <h2>Contact Us</h2>
        <p>Have questions? We'd love to hear from you.</p>

        <form id="contactForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea id="message" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Send Message</button>
        </form>

    <div class="contact-info">
    <a href="https://wa.me/919699214024" target="_blank" class="info-item">
        <i class="fab fa-whatsapp"></i>
    </a>

    <a href="mailto:support@cityshop.com" class="info-item">
        <i class="fas fa-envelope"></i>
    </a>

    <a href="tel:+919699214024" class="info-item">
        <i class="fas fa-phone-alt"></i>
    </a>
</div>

    </div><!-- end contact-container -->

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.querySelector(".btn-submit");
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            btn.disabled = true;

            // Simulate send with visual feedback
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i> Message Sent!';
                setTimeout(() => {
                    btn.innerHTML = 'Send Message';
                    btn.disabled = false;
                    this.reset();
                }, 2000);
            }, 1200);
        });
    </script>

</body>
</html>
