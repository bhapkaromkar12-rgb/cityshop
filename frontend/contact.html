<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact Us - AgroTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --primary: #74c947;
            --primary-dark: #5aab32;
            --dark-bg: #090d09;
            --card-bg: rgba(18, 28, 18, 0.96);
            --text-gray: #a0a0a0;
            --border: rgba(255,255,255,0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.65)),
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 20px calc(20px + env(safe-area-inset-bottom));
            padding-top: calc(80px + env(safe-area-inset-top));
        }

        /* iOS: fixed bg breaks */
        @media (max-width: 768px) {
            body { background-attachment: scroll; }
        }

        /* ── Back Button ── */
        .btn-back-top {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 16px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            text-decoration: none;
            z-index: 1000;
            transition: background 0.25s, transform 0.2s;
        }
        .btn-back-top:hover { background: var(--primary); transform: scale(1.08); }
        .btn-back-top:active { transform: scale(0.93); }

        /* ── Card ── */
        .contact-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            width: 100%;
            max-width: 460px;
            padding: 40px 36px;
            border-radius: 24px;
            border: 1px solid rgba(116,201,71,0.18);
            box-shadow: 0 30px 60px rgba(0,0,0,0.55);
        }

        /* ── Header ── */
        .card-header { text-align: center; margin-bottom: 28px; }

        .card-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: rgba(116,201,71,0.12);
            border: 1px solid rgba(116,201,71,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--primary);
            margin: 0 auto 16px;
        }

        .card-header h2 {
            font-size: clamp(22px, 5vw, 28px);
            color: var(--primary);
            margin: 0 0 8px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .card-header p {
            color: var(--text-gray);
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }

        /* ── Form ── */
        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--primary);
            margin-bottom: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 16px; /* prevents iOS zoom */
            font-family: 'Inter', sans-serif;
            -webkit-appearance: none;
            transition: border-color 0.25s, background 0.25s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder { color: #555; }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(116,201,71,0.06);
        }

        .form-group textarea {
            height: 120px;
            resize: none;
            line-height: 1.5;
        }

        /* ── Submit ── */
        .btn-submit {
            background: var(--primary);
            color: #0a180a;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 24px rgba(116,201,71,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 6px;
            font-family: 'Inter', sans-serif;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(116,201,71,0.45);
        }

        .btn-submit:active { transform: scale(0.96); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

        /* ── Toast ── */
        .toast {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(116,201,71,0.12);
            border: 1px solid rgba(116,201,71,0.3);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            color: var(--primary);
            margin-top: 16px;
        }
        .toast.show { display: flex; }

        /* ── Social Row ── */
        .contact-socials {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 16px;
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .social-btn {
            color: var(--text-gray);
            font-size: 20px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            text-decoration: none;
            transition: color 0.25s, background 0.25s, transform 0.2s;
        }

        .social-btn:hover {
            color: var(--primary);
            background: rgba(116,201,71,0.1);
            border-color: rgba(116,201,71,0.3);
            transform: translateY(-2px);
        }

        .social-btn .fab.fa-whatsapp:hover { color: #25D366; }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .contact-card { padding: 28px 20px; border-radius: 20px; }
            .card-icon { width: 54px; height: 54px; font-size: 22px; border-radius: 14px; }
        }

        @media (max-width: 360px) {
            body { padding: 70px 12px 20px; }
            .contact-card { padding: 24px 16px; border-radius: 16px; }
            .card-header h2 { font-size: 20px; }
        }

        /* Full-screen on very small with little height (landscape phone) */
        @media (max-height: 600px) and (max-width: 768px) {
            body { align-items: flex-start; padding-top: 70px; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back-top" aria-label="Go back">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="contact-card">
        <div class="card-header">
            <div class="card-icon"><i class="fas fa-headset"></i></div>
            <h2>Contact Us</h2>
            <p>Have a question or feedback? We're here to help you.</p>
        </div>

        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="inp-name">Full Name</label>
                <input type="text" id="inp-name" placeholder="Enter your full name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="inp-email">Email Address</label>
                <input type="email" id="inp-email" placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="inp-msg">Message</label>
                <textarea id="inp-msg" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i>&nbsp; Send Message
            </button>

            <div class="toast" id="successToast">
                <i class="fas fa-check-circle"></i>
                <span>Message sent! We'll get back to you shortly.</span>
            </div>
        </form>

        <div class="contact-socials">
            <a href="https://wa.me/919699214024" target="_blank" rel="noopener" class="social-btn" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="mailto:support@agrotech.com" class="social-btn" title="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="tel:+919699214024" class="social-btn" title="Call">
                <i class="fas fa-phone-alt"></i>
            </a>
        </div>
    </div>

    <script>
        const form = document.getElementById("contactForm");
        const btn  = document.getElementById("submitBtn");
        const toast = document.getElementById("successToast");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const name    = document.getElementById("inp-name").value.trim();
            const email   = document.getElementById("inp-email").value.trim();
            const message = document.getElementById("inp-msg").value.trim();

            if (!name || !email || !message) {
                btn.style.background = "#ff4d4d";
                btn.innerHTML = '<i class="fas fa-exclamation-circle"></i>&nbsp; Fill all fields';
                setTimeout(() => {
                    btn.style.background = "";
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i>&nbsp; Send Message';
                }, 2000);
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Sending...';
            btn.disabled = true;

            // Simulate network send (replace with real API call if available)
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check"></i>&nbsp; Message Sent!';
                toast.classList.add("show");
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i>&nbsp; Send Message';
                    btn.disabled = false;
                    toast.classList.remove("show");
                    form.reset();
                }, 3000);
            }, 1400);
        });
    </script>

</body>
</html>
