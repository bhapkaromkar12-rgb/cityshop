<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #74c947;
            --dark-card: rgba(22, 22, 22, 0.95);
            --text-gray: #a0a0a0;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white;
            padding: 20px;
        }

        /* Top Left Back Icon */
        .btn-back-top {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            z-index: 1000;
        }

        .payment-box { 
            background: var(--dark-card); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 400px; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            box-sizing: border-box;
        }

        h2 { color: var(--primary); font-size: 22px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .order-summary { 
            background: rgba(116, 201, 71, 0.1); 
            padding: 15px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            text-align: left; 
            border-left: 4px solid var(--primary); 
            font-size: 14px;
            line-height: 1.6;
        }

        .qr-section { 
            margin: 20px 0; 
            display: none; 
            background: white; 
            padding: 15px; 
            border-radius: 20px;
            display: inline-block;
        } 
        
        .qr-section img { width: 180px; border-radius: 10px; }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            color: white;
            box-sizing: border-box; 
            font-size: 16px;
        }
        input:focus { outline: none; border-color: var(--primary); }

        .btn-pay { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            width: 100%; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 16px; 
            margin-top: 15px; 
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
        }

        .payment-apps { 
            display: flex; 
            justify-content: space-around; 
            margin-top: 20px; 
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .app-item { cursor: pointer; transition: 0.3s; text-align: center; }
        .app-item:active { transform: scale(0.9); }
        .app-item img { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 5px; }
        .app-item span { display: block; font-size: 10px; color: var(--text-gray); }

        .scan-text { font-weight: bold; color: #333; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

<a href="view.html" class="btn-back-top"><i class="fas fa-arrow-left"></i></a>

<div class="payment-box">
    <h2>Confirm & Pay</h2>
    
    <div id="summary" class="order-summary">
        <p><i class="fas fa-spinner fa-spin"></i> Loading product details...</p>
    </div>

    <form id="orderForm">
        <input type="text" id="custName" placeholder="Your Full Name" required>
        <input type="text" id="custAddress" placeholder="Full Delivery Address" required>
        <input type="text" id="custPhone" placeholder="Mobile Number" required>
        
        <div id="qrContainer" style="display:none; margin-top: 20px;">
            <div class="qr-section">
                <p class="scan-text">Scan QR to Pay</p>
                <img id="qrCodeImg" src="" alt="Payment QR">
            </div>

            <div class="payment-apps">
                <div class="app-item" onclick="payViaApp('gpay')">
                    <img src="https://img.icons8.com/color/48/google-pay-india.png">
                    <span>GPay</span>
                </div>
                <div class="app-item" onclick="payViaApp('phonepe')">
                    <img src="https://img.icons8.com/color/48/phonepe.png">
                    <span>PhonePe</span>
                </div>
                <div class="app-item" onclick="payViaApp('paytm')">
                    <img src="https://img.icons8.com/color/48/paytm.png">
                    <span>Paytm</span>
                </div>
            </div>
        </div>

        <button type="submit" id="mainBtn" class="btn-pay">Confirm Order</button>
    </form>
</div>

<script>
    const productId = localStorage.getItem("selectedProductId");
    const user = JSON.parse(localStorage.getItem("user"));
    let productPrice = 0;

    if(!user) window.location.href = "index1.html";

    // 1. Fetch Product Details
    fetch(`https://cityshobackend.onrender.com/get-products`)
    .then(res => res.json())
    .then(data => {
        const products = data.products || data;
        const product = products.find(p => p.id == productId);
        if(product) {
            productPrice = product.price;
            document.getElementById("summary").innerHTML = `
                <div style="color:var(--primary); font-weight:bold; margin-bottom:5px;">${product.name}</div>
                <div style="font-size:18px; font-weight:800;">₹${product.price}</div>
                <div style="color:var(--text-gray); font-size:12px;">Location: ${product.city}</div>
            `;
            generateQR(product.price);
        }
    });

    function generateQR(amount) {
        const upiId = "9699214024@ybl"; 
        const name = "City Shop";
        const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
        const qrImg = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
        
        document.getElementById("qrCodeImg").src = qrImg;
        document.getElementById("qrContainer").style.display = "block";
    }

    function payViaApp(app) {
        const upiId = "9699214024@ybl";
        const name = "City Shop";
        const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${productPrice}&cu=INR`;

        if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
            window.location.href = upiUrl;
        } else {
            alert("Please scan the QR code from your mobile app.");
        }
    }

    document.getElementById("orderForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const btn = document.getElementById("mainBtn");
        btn.innerText = "Processing...";
        btn.disabled = true;
        
        const orderData = {
            user_id: user.id,
            product_id: productId,
            name: document.getElementById("custName").value,
            address: document.getElementById("custAddress").value,
            phone: document.getElementById("custPhone").value
        };

        fetch("https://citysho.onrender.com/place-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(orderData)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert("Order Placed Successfully!");
                window.location.href = "my-orders.html";
            } else {
                alert("Error placing order.");
                btn.innerText = "Confirm Order";
                btn.disabled = false;
            }
        })
        .catch(err => {
            alert("Server Error!");
            btn.innerText = "Confirm Order";
            btn.disabled = false;
        });
    });
</script>
</body>
</html>
