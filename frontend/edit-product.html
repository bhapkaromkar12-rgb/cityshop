<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - City Shop</title>
  <style>
    :root {
        --primary: #74c947;
        --dark-card: rgba(18, 18, 18, 0.9);
        --text-gray: #b0b0b0;
    }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        /* Custom Background jo tumne mangi thi */
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.4)), 
                    url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        padding: 20px 0;
    }

    .container {
        background: var(--dark-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        width: 90%;
        max-width: 400px;
        padding: 30px 25px;
        border-radius: 25px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        animation: slideUp 0.6s ease-out;
        box-sizing: border-box;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h2 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--primary);
    }

    label {
        font-size: 13px;
        color: var(--text-gray);
        margin-left: 5px;
        margin-bottom: 5px;
        display: block;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 13px 15px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 16px; /* Phone auto-zoom fix */
        margin-bottom: 15px;
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
    }

    input:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 10px rgba(116, 201, 71, 0.2);
    }

    /* Style for File Input */
    input[type="file"] {
        padding: 10px;
        font-size: 14px;
        background: rgba(116, 201, 71, 0.05);
    }

    .update-btn {
        width: 100%;
        padding: 15px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.4s;
        margin-top: 10px;
        box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
    }

    .update-btn:active {
        transform: scale(0.97);
    }

    .cancel-link {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
    }

    .cancel-link a {
        color: var(--text-gray);
        text-decoration: none;
        transition: 0.3s;
    }

    .cancel-link a:hover {
        color: #ff4d4d; /* Red on hover for cancel */
    }

    /* Tablet/Phone responsiveness */
    @media (max-height: 700px) {
        body { align-items: flex-start; }
        .container { margin-top: 10px; margin-bottom: 10px; }
    }
</style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Edit Product</h2>
    <form id="editForm" enctype="multipart/form-data">
        <input type="hidden" id="productId">
        
        <label>Product Name</label>
        <input type="text" id="name" name="name" required>
        
        <label>Price (₹)</label>
        <input type="number" id="price" name="price" required>
        
        <label>City</label>
        <input type="text" id="city" name="city" required>
        
        <label>Quantity</label>
        <input type="number" id="quantity" name="quantity" required>

      
        <label>Update Photo (Optional)</label>
        <input type="file" id="image" name="image" accept="image/*">
        
        <button type="submit" class="update-btn">Save Changes</button>
        <p style="text-align: center;"><a href="admin_dash.html" style="color: #666;">Cancel</a></p>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    function loadExistingData() {
        // Corrected URL to match your backend
        fetch(`https://cityshobackend.onrender.com/get-product/${productId}`)
        .then(res => {
            if (!res.ok) throw new Error("Product not found");
            return res.json();
        })
        .then(p => {
            // Data fields update
            document.getElementById("name").value = p.name;
            document.getElementById("price").value = p.price;
            document.getElementById("city").value = p.city;
            document.getElementById("quantity").value = p.quantity;
            document.getElementById("description").value = p.description || "";
            document.getElementById("productId").value = p.id; 
        })
        .catch(err => console.error("Load Error:", err));
    }

    // UPDATE Function ko aise sahi karo
document.getElementById("editForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    let formData = new FormData();
    formData.append("name", document.getElementById("name").value);
    formData.append("price", document.getElementById("price").value);
    formData.append("city", document.getElementById("city").value);
    formData.append("quantity", document.getElementById("quantity").value);
    
    const imageFile = document.getElementById("image").files[0];
    if(imageFile) {
        formData.append("image", imageFile);
    }

    fetch(`https://cityshobackend.onrender.com/update-product/${productId}`, {
        method: 'PUT',
        body: formData 
    })
    .then(async res => {
        const text = await res.text();
        if (!res.ok) throw new Error(text || "Server Error");
        return text;
    })
    .then(msg => {
        alert("Success: " + msg);
        window.location.href = "admin_dash.html";
    })
    .catch(err => {
        alert("Update Failed: " + err.message);
    });
       // <--- Bas ek baar ye aayega
    }); // Yahan extra block hata diya gaya hai

    if(productId) loadExistingData();
</script>
</body>
</html>
