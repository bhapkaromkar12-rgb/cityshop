<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - City Shop</title>
    <style>
        body { font-family: sans-serif; background: linear-gradient(135deg, #2ae7bb, #ff7eb3); min-height: 100vh; margin: 0; padding: 20px; }
        .container { width: 90%; max-width: 400px; margin: 50px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .update-btn { width: 100%; padding: 15px; background: #26d7c5; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">Edit Product</h2>
    <form id="editForm" enctype="multipart/form-data">
        <input type="hidden" id="productId">
        
        <label>Product Name</label>
        <input type="text" id="name" name="name" required>
        
        <label>Price (₹)</label>
        <input type="number" id="price" name="price" required>
        
        <label>City</label>
        <input type="text" id="city" name="city" required>
        
        <label>Quantity</label>
        <input type="number" id="quantity" name="quantity" required>
        
        <label>Update Photo (Optional)</label>
        <input type="file" id="image" name="image" accept="image/*">
        
        <button type="submit" class="update-btn">Save Changes</button>
        <p style="text-align: center;"><a href="admin_dash.html" style="color: #666;">Cancel</a></p>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    // Purana data load karne ka function wahi rahega...
    function loadExistingData() {
        fetch(`https://cityshobackend.onrender.com/get-product/${productId}`)
        .then(res => res.json())
        .then(p => {
            document.getElementById("name").value = p.name;
            document.getElementById("price").value = p.price;
            document.getElementById("city").value = p.city;
            document.getElementById("quantity").value = p.quantity;
        });
    }

    // UPDATE Function (Naya logic)
    document.getElementById("editForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        // FormData use karenge kyunki file bhejni hai
        let formData = new FormData();
        formData.append("name", document.getElementById("name").value);
        formData.append("price", document.getElementById("price").value);
        formData.append("city", document.getElementById("city").value);
        formData.append("quantity", document.getElementById("quantity").value);
        
        const imageFile = document.getElementById("image").files[0];
        if(imageFile) {
            formData.append("image", imageFile);
        }

        fetch(`https://cityshobackend.onrender.com/update-product/${productId}`, {
            method: 'PUT',
            body: formData // No headers needed for FormData
        })
        .then(res => res.text())
        .then(msg => {
            alert(msg);
            window.location.href = "admin_dash.html";
        })
        .catch(err => alert("Update failed!"));
    });

    if(productId) loadExistingData();
</script>
</body>
</html>
