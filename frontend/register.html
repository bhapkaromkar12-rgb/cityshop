<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Agro City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #74c947; /* Agro Green */
            --dark-bg: #0a0a0a;
            --card-bg: rgba(25, 25, 25, 0.9);
            --text-gray: #a0a0a0;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            /* Same matching background as login */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1495107333279-99457c6753e0?auto=format&fit=crop&q=80&w=1500');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .register-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            width: 90%;
            max-width: 420px;
            padding: 40px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.7s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area i {
            font-size: 35px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p.subtitle {
            color: var(--text-gray);
            font-size: 13px;
            margin-top: 5px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 13px 15px 13px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(116, 201, 71, 0.2);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        button {
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.4s;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
        }

        button:hover {
            background: #5ea33a;
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(116, 201, 71, 0.4);
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo-area">
        <i class="fas fa-seedling"></i>
        <h2>Join AgroTech</h2>
        <p class="subtitle">Create an account to start farming smarter</p>
    </div>

    <form id="registerForm">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <i class="fas fa-user-shield"></i>
            <select name="role">
                <option value="customer" selected>Customer / Farmer</option>
                <option value="admin">Admin Panel</option>
            </select>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer-links">
        Already have an account? <a href="index1.html">Login here</a>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.innerText = "Registering...";
    btn.disabled = true;

    let data = {
        username: this.username.value,
        email: this.email.value,
        password: this.password.value,
        role: this.role.value
    };

    fetch("https://cityshobackend.onrender.com/register", { 
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        if(result.success) {
            alert("Success: " + result.message);
            window.location.href = "index1.html";
        } else {
            alert("Error: " + result.message);
            btn.innerText = "Create Account";
            btn.disabled = false;
        }
    })
    .catch(err => {
        console.error("Register Error:", err);
        alert("Server error. Please check your connection.");
        btn.innerText = "Create Account";
        btn.disabled = false;
    });
});
</script>

</body>
</html>
