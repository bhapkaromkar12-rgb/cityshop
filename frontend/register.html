<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Agro City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    :root {
        --primary: #74c947;
        --dark-card: rgba(15, 15, 15, 0.9);
        --text-gray: #b0b0b0;
    }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.6)), 
                    url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: white;
        overflow-x: hidden;
    }

    /* Navbar - Mobile Optimized */
    .navbar { 
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(15px);
        padding: 12px 5%; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        position: fixed; 
        top: 0; 
        width: 100%;
        z-index: 1000;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        box-sizing: border-box;
    }

    .logo { 
        font-size: 18px; 
        font-weight: 800; 
        display: flex; 
        align-items: center; 
        gap: 8px; 
        text-transform: uppercase;
    }
    .logo i { color: var(--primary); }

    /* Register Container - Handling long forms on mobile */
    .register-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 15px;
        margin-top: 60px; /* Space for Navbar */
        margin-bottom: 20px;
    }

    .register-card {
        background: var(--dark-card);
        backdrop-filter: blur(25px);
        width: 100%;
        max-width: 400px;
        padding: 30px 20px;
        border-radius: 20px; 
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        box-sizing: border-box;
        animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
        text-align: center;
        margin-bottom: 20px;
    }

    .logo-area i {
        font-size: 38px;
        color: var(--primary);
        margin-bottom: 8px;
    }

    h2 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
    p.subtitle { color: var(--text-gray); font-size: 13px; margin-top: 4px; }

    form { gap: 12px; margin-top: 18px; display: flex; flex-direction: column; }

    .input-group { position: relative; }
    .input-group i { 
        position: absolute; 
        left: 15px; 
        top: 50%; 
        transform: translateY(-50%); 
        color: var(--primary);
        font-size: 15px;
    }

    input, select {
        width: 100%;
        padding: 13px 15px 13px 45px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 16px; /* Important for Mobile Typing zoom fix */
        outline: none;
        box-sizing: border-box;
        transition: 0.3s;
    }

    input:focus, select:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.12);
    }

    button {
        width: 100%;
        background: var(--primary);
        color: white;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 8px;
        box-shadow: 0 8px 15px rgba(116, 201, 71, 0.3);
    }

    button:active { transform: scale(0.98); }

    .footer-links {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--text-gray);
    }

    .footer-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
        margin-left: 5px;
    }

    /* Viewport Height Fix for Mobile Browsers */
    @media (max-height: 700px) {
        .register-container { align-items: flex-start; }
        .register-card { padding: 25px 15px; }
    }
</style>
</head>
<body>

<div class="register-card">
    <div class="logo-area">
        <i class="fas fa-seedling"></i>
        <h2>Join AgroTech</h2>
        <p class="subtitle">Create an account to start farming smarter</p>
    </div>

    <form id="registerForm">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Username" required>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <i class="fas fa-user-shield"></i>
            <select name="role">
                <option value="customer" selected>Customer / Farmer</option>
                <option value="admin">Admin Panel</option>
            </select>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="footer-links">
        Already have an account? <a href="index1.html">Login here</a>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.innerText = "Registering...";
    btn.disabled = true;

    let data = {
        username: this.username.value,
        email: this.email.value,
        password: this.password.value,
        role: this.role.value
    };

    fetch("https://cityshobackend.onrender.com/register", { 
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        if(result.success) {
            alert("Success: " + result.message);
            window.location.href = "index1.html";
        } else {
            alert("Error: " + result.message);
            btn.innerText = "Create Account";
            btn.disabled = false;
        }
    })
    .catch(err => {
        console.error("Register Error:", err);
        alert("Server error. Please check your connection.");
        btn.innerText = "Create Account";
        btn.disabled = false;
    });
});
</script>

</body>
</html>
