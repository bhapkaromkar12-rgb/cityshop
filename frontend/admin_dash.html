<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - City Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   <style>
    :root {
        --primary: #74c947;
        --dark-bg: #0a0a0a;
        --card-bg: rgba(25, 25, 25, 0.9);
        --text-gray: #b0b0b0;
        --danger: #ff4d4d;
        --warning: #ffc107;
    }

    body { 
        margin: 0; 
        font-family: 'Inter', sans-serif; 
       background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.4)), 
                    url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
        background-size: cover;
        background-position: center; 
        color: white; 
        min-height: 100vh;
    }
    
    /* Premium Navbar */
    .navbar { 
        background: rgba(0, 0, 0, 0.85); 
        backdrop-filter: blur(15px);
        padding: 15px 5%; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        box-sizing: border-box;
    }

    /* Dashboard Layout */
    .container { 
        padding: 20px 15px; 
        max-width: 600px; /* Mobile focused width */
        margin: auto; 
    }
    
    .header-section { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 25px; 
        padding-top: 10px;
    }

    .header-section h3 { margin: 0; font-size: 20px; color: var(--primary); }

    .btn-add { 
        background: var(--primary); 
        color: white; 
        padding: 10px 15px; 
        border-radius: 10px; 
        text-decoration: none; 
        font-weight: bold;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 5px 15px rgba(116, 201, 71, 0.3);
    }

    /* Product Card - Premium Mobile Design */
    .product-item { 
        background: var(--card-bg); 
        backdrop-filter: blur(10px);
        margin-bottom: 15px; 
        padding: 15px; 
        border-radius: 18px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .product-info { display: flex; align-items: center; gap: 15px; }
    
    .product-img { 
        width: 60px; 
        height: 60px; 
        border-radius: 12px; 
        object-fit: cover; 
        background: #1a1a1a;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .product-details h4 { 
        margin: 0; 
        font-size: 16px; 
        font-weight: 600;
        color: #fff;
    }
    .product-details p { 
        margin: 4px 0 0; 
        color: var(--primary); 
        font-weight: 800; 
        font-size: 15px;
    }

    /* Actions - Mobile Optimized Buttons */
    .actions { display: flex; gap: 10px; }
    
    .btn-edit, .btn-delete { 
        border: none; 
        padding: 10px; 
        border-radius: 10px; 
        cursor: pointer; 
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
    }

    .btn-edit { 
        background: rgba(255, 193, 7, 0.1); 
        color: var(--warning); 
        border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .btn-delete { 
        background: rgba(255, 77, 77, 0.1); 
        color: var(--danger); 
        border: 1px solid rgba(255, 77, 77, 0.3);
    }

    .btn-edit:active, .btn-delete:active { transform: scale(0.9); }

    /* Responsive adjustments */
    @media (max-width: 480px) {
        .product-item { 
            position: relative;
            padding-bottom: 20px;
        }
        /* Mobile par buttons ko align karne ke liye */
        .actions {
            position: absolute;
            right: 15px;
            bottom: 15px;
        }
        .product-details {
            margin-bottom: 10px;
        }
    }
</style>
</head>
<body>

<div class="navbar">
    <div style="font-weight: bold; font-size: 20px;">City Shop Admin</div>
    <a href="#" onclick="logout()" style="color: white; font-size: 14px;">Logout</a>
</div>

<div class="container">
    <div class="header-section">
        <h3>Your Products</h3>
        <a href="admin.html" class="btn-add"><i class="fas fa-plus"></i> Add New</a>
    </div>

    <div id="list">
        <p style="text-align: center; color: #888;">Loading products...</p>
    </div>
</div>

<script>
    function loadAdminProducts() {
        const admin = JSON.parse(localStorage.getItem("user"));
        if(!admin) { window.location.href = "index.html"; return; }

        // Note: Check karo ki endpoint yahi hai ya /get-products?
        // Agar aapko specific admin ke products chahiye toh ye sahi hai
        fetch(`https://cityshobackend.onrender.com/get-products`) 
        .then(res => res.json())
        .then(data => {
            const listContainer = document.getElementById("list");
            listContainer.innerHTML = '';
            
            const products = data.products || data;

            if(products.length === 0) {
                listContainer.innerHTML = "<p>No products found. Start adding!</p>";
                return;
            }

            products.forEach(p => {
                listContainer.innerHTML += `
                    <div class="product-item">
                        <div class="product-info">
                           <img src="${p.image && p.image.startsWith('http') ? p.image : 'https://cityshobackend.onrender.com/uploads/' + p.image}" class="product-img" onerror="this.src='https://via.placeholder.com/50'" alt="img">
                            <div class="product-details">
                                <h4>${p.name}</h4>
                                <p>₹${p.price}</p>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="editProduct(${p.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>`;
            });
        })
        .catch(err => {
            document.getElementById("list").innerHTML = "Error loading products.";
        });
    }

    function deleteProduct(id) {
    if (confirm("Bhai, kya aap sach mein is product ko nikalna chahte ho?")) {
        fetch(`https://cityshobackend.onrender.com/delete-product/${id}`, {
            method: 'DELETE',
        })
        .then(res => res.text())
        .then(data => {
            alert(data);
            loadAdminProducts(); // List refresh karne ke liye taaki deleted item gayab ho jaye
        })
        .catch(err => {
            console.error("Error:", err);
            alert("Kuch gadbad ho gayi delete karte waqt!");
        });
    }
}

    function editProduct(id) {
        window.location.href = `edit-product.html?id=${id}`;
    }

    function logout() {
        localStorage.removeItem("user");
        window.location.href = "index.html";
    }

    // Load products on start
    loadAdminProducts();
</script>

</body>
</html>
