<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090d09">
    <title>Manage Orders - AgroTech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #74c947;
            --dark-card: rgba(22, 22, 22, 0.95);
            --text-gray: #a0a0a0;
            --pending: #ffc107;
            --delivered: #74c947;
            --cancelled: #ff4d4d;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.72)),
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=1400');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }

        /* Floating Back Icon (Top Left) */
        .btn-back-top {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            text-decoration: none;
            z-index: 1001;
        }

        .container {
            padding: 72px 14px 30px;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            max-width: 640px;
            margin: auto;
        }
        
        h2 { 
            font-size: 22px; 
            color: var(--primary); 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 800;
        }

        #orderTableBody {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Mobile Optimized Cards */
        tr { 
            display: flex; 
            flex-direction: column; 
            background: var(--dark-card); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px; 
            border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        td { 
            padding: 8px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 14px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        td:last-of-type { border-bottom: none; }

        td::before {
            content: attr(data-label);
            font-weight: 600;
            color: var(--text-gray);
            font-size: 11px;
            text-transform: uppercase;
        }

        /* Status Badges */
        .status-badge { 
            padding: 5px 12px; 
            border-radius: 8px; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase;
        }
        .received { background: rgba(23, 162, 184, 0.15); color: #17a2b8; border: 1px solid rgba(23, 162, 184, 0.3); }
        .delivered { background: rgba(116, 201, 71, 0.15); color: var(--delivered); border: 1px solid rgba(116, 201, 71, 0.3); }
        .cancelled { background: rgba(255, 77, 77, 0.15); color: var(--cancelled); border: 1px solid rgba(255, 77, 77, 0.3); }
        .pending { background: rgba(255, 193, 7, 0.15); color: var(--pending); border: 1px solid rgba(255, 193, 7, 0.3); }

        /* Action Buttons */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .btn { 
            padding: 12px 5px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            color: white; 
            font-size: 10px; 
            font-weight: 800;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-receive { background: #17a2b8; box-shadow: 0 4px 15px rgba(23, 162, 184, 0.3); }
        .btn-deliver { background: var(--primary); box-shadow: 0 4px 15px rgba(116, 201, 71, 0.3); }
        .btn-cancel { background: #dc3545; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3); }
        
        .btn:active { transform: scale(0.9); }

        .order-closed {
            text-align: center;
            width: 100%;
            color: var(--text-gray);
            font-size: 12px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        thead { display: none; }
        table { width: 100%; display: block; }

        @media (max-width: 480px) {
            .container { padding: 66px 10px 25px; }
            tr { padding: 16px 14px; border-radius: 18px; }
            td { font-size: 13px; padding: 6px 0; }
            .btn { padding: 10px 4px; font-size: 9px; }
            .status-badge { padding: 4px 8px; font-size: 9px; }
            h2 { font-size: 18px; }
        }
        @media (max-width: 360px) {
            .container { padding: 62px 8px 20px; }
            .btn-group { gap: 6px; }
        }
    </style>
</head>
<body>

<a href="admin.html" class="btn-back-top" style="text-decoration:none;"><i class="fas fa-arrow-left"></i></a>

<div class="container">
    <h2><i class="fas fa-tasks"></i> Manage Orders</h2>
    <table>
        <tbody id="orderTableBody">
            </tbody>
    </table>
</div>

<script>
    const BASE_URL = "https://cityshobackend.onrender.com";

    function loadOrders() {
        fetch(`${BASE_URL}/get-all-orders`)
        .then(res => res.json())
        .then(data => {
            const orders = data.orders || data || [];
            const tbody = document.getElementById("orderTableBody");
            tbody.innerHTML = "";
            if (!orders.length) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding: 40px; color: #666;">No orders found.</td></tr>`;
                return;
            }
            orders.forEach(order => {
                const statusLower = (order.status || 'pending').toLowerCase();
                const productName = order.product_name || `Product #${order.product_id}`;
                const imgUrl = order.image
                    ? (order.image.startsWith('http') ? order.image : `${BASE_URL}/uploads/${order.image}`)
                    : '';
                tbody.innerHTML += `
                    <tr>
                        <td data-label="Order ID">#${order.id}</td>
                        <td data-label="Customer">${order.customer_name || order.buyer_name || 'User'}</td>
                        <td data-label="Product">${productName}</td>
                        <td data-label="Amount">₹${parseFloat(order.price || order.total_price || 0).toFixed(2)}</td>
                        <td data-label="Status"><span class="status-badge ${statusLower}">${order.status || 'Pending'}</span></td>
                        <td data-label="Actions">
                            <div class="btn-group">
                                ${order.status !== 'Delivered' && order.status !== 'Cancelled' ? `
                                    <button class="btn btn-receive" onclick="updateStatus(${order.id}, 'Received')">Receive</button>
                                    <button class="btn btn-deliver" onclick="updateStatus(${order.id}, 'Delivered')">Deliver</button>
                                    <button class="btn btn-cancel" onclick="updateStatus(${order.id}, 'Cancelled')">Cancel</button>
                                ` : '<div class="order-closed"><i class="fas fa-check-circle"></i> Completed</div>'}
                            </div>
                        </td>
                    </tr>
                `;
            });
        })
        .catch(err => {
            document.getElementById("orderTableBody").innerHTML =
                `<tr><td colspan="6" style="text-align:center;padding:30px;color:#ffc107;"><i class="fas fa-exclamation-triangle"></i> Failed to load orders.</td></tr>`;
        });
    }

    function updateStatus(orderId, newStatus) {
        if (!confirm(`Mark order #${orderId} as ${newStatus}?`)) return;

        fetch(`${BASE_URL}/update-order-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, status: newStatus })
        })
        .then(res => res.json())
        .then(() => loadOrders())
        .catch(() => alert("Update failed!"));
    }

    loadOrders();
</script>
</body>
</html>
