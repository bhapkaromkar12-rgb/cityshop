<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City Shop Agro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    :root {
        --primary: #74c947;
        --dark-card: rgba(20, 20, 20, 0.85);
        --text-gray: #b0b0b0;
    }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        overflow-x: hidden;
    }

    /* Mobile Responsive Card */
    .login-card {
        background: var(--dark-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        width: 90%;
        max-width: 400px;
        padding: 30px 22px;
        border-radius: 25px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        animation: fadeIn 0.8s ease-out;
        box-sizing: border-box;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .logo-area {
        text-align: center;
        margin-bottom: 20px;
    }

    .logo-area i {
        font-size: 42px;
        color: var(--primary);
        margin-bottom: 8px;
        filter: drop-shadow(0 0 10px rgba(116, 201, 71, 0.3));
    }

    h2 {
        font-size: 22px;
        margin: 0;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: 800;
    }

    p.subtitle {
        color: var(--text-gray);
        font-size: 13px;
        margin-top: 5px;
    }

    /* Role Switcher */
    .role-switcher {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 6px;
        margin-bottom: 15px;
    }

    .role-tab {
        border: none;
        background: transparent;
        color: #d9d9d9;
        border-radius: 12px;
        padding: 10px 4px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }

    .role-tab.active {
        background: var(--primary);
        color: white;
        box-shadow: 0 6px 12px rgba(116, 201, 71, 0.22);
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
    }

    .input-group {
        position: relative;
    }

    .input-group i.left-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary);
        font-size: 15px;
    }

    .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-gray);
        cursor: pointer;
        font-size: 14px;
    }

    input, select {
        width: 100%;
        padding: 13px 15px 13px 45px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 16px;
        transition: 0.3s;
        outline: none;
        box-sizing: border-box;
        appearance: none;
    }

    input:focus, select:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 15px rgba(116, 201, 71, 0.15);
    }

    button[type="submit"] {
        background: var(--primary);
        color: white;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        transition: 0.4s;
        margin-top: 5px;
        box-shadow: 0 10px 20px rgba(116, 201, 71, 0.3);
    }

    button:active {
        transform: scale(0.98);
    }

    /* OR Divider */
    .divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: var(--text-gray);
        font-size: 12px;
        font-weight: 600;
        margin: 15px 0;
    }

    .divider::before, .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .divider span {
        padding: 0 10px;
    }

    /* Google Button */
    .btn-google {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 12px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-google:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.3);
    }

    .footer-links {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--text-gray);
    }

    .footer-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
    }

    /* --- PREMIUM PLANT LOADER CSS STYLES --- */
    .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 10, 0.95);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .loader-content {
        text-align: center;
    }

    .plant-animation-box {
        position: relative;
        width: 130px;
        height: 130px;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .plant-icon {
        font-size: 65px;
        color: #554433;
        transition: color 1.2s ease-in-out, transform 1.2s ease-in-out;
        animation: breathEffect 2s infinite ease-in-out;
    }

    .loader-overlay.growing .plant-icon {
        color: var(--primary);
        transform: scale(1.25) rotate(8deg);
    }

    .success-checkmark {
        position: absolute;
        font-size: 70px;
        color: var(--primary);
        opacity: 0;
        transform: scale(0.4);
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: none;
    }

    .loader-overlay.success .success-checkmark {
        display: block;
        opacity: 1;
        transform: scale(1);
    }

    .loader-overlay.success .plant-icon {
        display: none;
    }

    .loader-text {
        font-size: 18px;
        font-weight: 600;
        color: #b0b0b0;
        margin: 0;
        letter-spacing: 1px;
        transition: color 0.3s;
    }

    .loader-overlay.success .loader-text {
        color: var(--primary);
        font-weight: 800;
    }

    @keyframes breathEffect {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }

    @media (max-width: 360px) {
        .login-card { padding: 25px 18px; }
        h2 { font-size: 20px; }
    }

    @media (max-height: 600px) {
        body {
            align-items: flex-start;
            padding: 20px 0;
        }
    }
</style>
</head>
<body>

<div id="loginLoader" class="loader-overlay">
    <div class="loader-content">
        <div class="plant-animation-box">
            <i class="fas fa-seedling plant-icon"></i>
            <div class="success-checkmark">
                <i class="fas fa-check-circle"></i>
            </div>
        </div>
        <p id="loaderText" class="loader-text">Verifying Details...</p>
    </div>
</div>

<div class="login-card">
    <div class="logo-area">
        <i class="fas fa-leaf"></i>
        <h2>Welcome Back</h2>
        <p class="subtitle">Access your Agro account</p>
    </div>

    <!-- Role Switcher -->
    <div class="role-switcher" aria-label="Account type selector">
        <button type="button" class="role-tab active" data-role="farmer">
            <i class="fas fa-tractor"></i>
            <span>Farmer</span>
        </button>
        <button type="button" class="role-tab" data-role="seller">
            <i class="fas fa-store"></i>
            <span>Seller</span>
        </button>
        <button type="button" class="role-tab" data-role="admin">
            <i class="fas fa-user-shield"></i>
            <span>Admin</span>
        </button>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <i class="fas fa-envelope left-icon"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock left-icon"></i>
            <input type="password" name="password" id="passInput" placeholder="Password" required>
            <i class="fas fa-eye toggle-password" onclick="togglePass()"></i>
        </div>

        <!-- Hidden role input mapped to role tabs -->
        <input type="hidden" name="role" id="roleSelect" value="farmer">

        <button type="submit">Sign In</button>
    </form>

    <div class="divider">
        <span>OR</span>
    </div>

    <!-- Google Sign In Button -->
    <button type="button" class="btn-google" onclick="googleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
        </svg>
        Continue with Google
    </button>

    <div class="footer-links">
        New User? <a href="register.html">Create Account</a>
    </div>
</div>

<script>
// Role switcher tab selection logic
const roleTabs = document.querySelectorAll('.role-tab');
const roleSelect = document.getElementById('roleSelect');

roleTabs.forEach(tab => {
    tab.addEventListener('click', () => {
        const selectedRole = tab.dataset.role;
        roleTabs.forEach(item => item.classList.toggle('active', item === tab));
        roleSelect.value = selectedRole;
    });
});

// Password Toggle Functionality
function togglePass() {
    const passInput = document.getElementById("passInput");
    const toggleIcon = document.querySelector(".toggle-password");
    if (passInput.type === "password") {
        passInput.type = "text";
        toggleIcon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        passInput.type = "password";
        toggleIcon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

function googleSignIn() {
    alert("Google Sign-In Clicked! Connect your Google OAuth backend API here.");
}

document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    const btn = this.querySelector('button[type="submit"]');
    btn.innerText = "Verifying...";
    btn.disabled = true;

    // --- LOADER ACTIVATE LOGIC ---
    const loader = document.getElementById("loginLoader");
    const loaderText = document.getElementById("loaderText");
    
    loader.style.display = "flex";
    loader.classList.remove("growing", "success");
    loaderText.innerText = "Verifying Details...";

    setTimeout(() => {
        loader.classList.add("growing");
        loaderText.innerText = "Growing your dashboard...";
    }, 500);

    let data = {
        email: this.email.value,
        password: this.password.value,
        role: this.role.value
    };

    fetch("https://cityshobackend.onrender.com/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
        if(res.success){
            // --- SUCCESS STATE LOGIC ---
            loader.classList.add("success");
            loaderText.innerText = "Verification Successful!";
            
            localStorage.setItem("user", JSON.stringify(res.user));
            
            setTimeout(() => {
                window.location.href = res.user.role === "admin" ? "admin.html" : "view.html";
            }, 1200);
        } else {
            loader.style.display = "none";
            alert("Invalid Credentials. Please try again.");
            btn.innerText = "Sign In";
            btn.disabled = false;
        }
    })
    .catch(err => {
        loader.style.display = "none";
        console.error("Login Error:", err);
        alert("Server connection failed!");
        btn.innerText = "Sign In";
        btn.disabled = false;
    });
});
</script>

</body>
</html>
