<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - City Shop Agro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   <style>
    :root {
        --primary: #74c947;
        --dark-card: rgba(15, 15, 15, 0.9);
        --text-gray: #b0b0b0;
    }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.6)), 
                    url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&q=80&w=2000');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: white;
        overflow-x: hidden; /* Phone par side scroll na aaye */
    }

    /* Mobile Responsive Navbar */
    .navbar { 
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(15px);
        padding: 12px 5%; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        position: fixed; 
        top: 0; 
        width: 100%;
        z-index: 1000;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        box-sizing: border-box;
    }

    .logo { 
        font-size: 18px; 
        font-weight: 800; 
        display: flex; 
        align-items: center; 
        gap: 8px; 
        letter-spacing: 0.5px;
    }

    .logo i { color: var(--primary); }

    /* Login Container - Mobile Centering */
    .login-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px; /* Kam padding taaki card bada dikhe */
        margin-top: 60px; 
    }

    .login-card {
        background: var(--dark-card);
        backdrop-filter: blur(25px);
        width: 100%;
        max-width: 380px; /* Mobile par width perfect fit hogi */
        padding: 30px 20px; /* Padding kam ki phone ke liye */
        border-radius: 20px; 
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        box-sizing: border-box;
    }

    .header-area {
        text-align: center;
        margin-bottom: 25px;
    }

    .header-area i {
        font-size: 40px;
        color: var(--primary);
        margin-bottom: 10px;
    }

    h2 { font-size: 22px; margin: 0; letter-spacing: 0.5px; }
    p.subtitle { color: var(--text-gray); font-size: 13px; margin-top: 5px; }

    form { gap: 15px; margin-top: 20px; }

    .input-group { position: relative; }
    .input-group i { 
        position: absolute; 
        left: 15px; 
        top: 50%; 
        transform: translateY(-50%); 
        color: var(--primary);
        font-size: 16px;
    }

    input, select {
        width: 100%;
        padding: 14px 15px 14px 45px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 16px; /* 16px se niche iOS zoom nahi karega */
        outline: none;
        box-sizing: border-box;
        transition: 0.3s ease;
    }

    input:focus, select:focus {
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.12);
    }

    button {
        width: 100%;
        background: var(--primary);
        color: white;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        margin-top: 10px;
        box-shadow: 0 8px 15px rgba(116, 201, 71, 0.3);
        transition: 0.3s;
    }

    button:active { transform: scale(0.98); } /* Phone par click effect */

    .footer-links {
        text-align: center;
        margin-top: 25px;
        font-size: 13px;
        color: var(--text-gray);
    }

    .footer-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
        margin-left: 5px;
    }

    /* Small Screen Adjustment */
    @media (max-width: 360px) {
        .login-card { padding: 20px 15px; }
        h2 { font-size: 18px; }
    }
</style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <i class="fas fa-leaf"></i>
        <h2>Welcome Back</h2>
        <p class="subtitle">Access your Agro account</p>
    </div>

    <form id="loginForm">
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group">
            <i class="fas fa-user-tag"></i>
            <select name="role">
                <option value="customer">Customer / Farmer</option>
                <option value="admin">Admin Panel</option>
            </select>
        </div>

        <button type="submit">Sign In</button>
    </form>

    <div class="footer-links">
        New User? <a href="register.html">Create Account</a>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    const btn = this.querySelector('button');
    btn.innerText = "Verifying...";
    btn.disabled = true;

    let data = {
        email: this.email.value,
        password: this.password.value,
        role: this.role.value
    };

    fetch("https://cityshobackend.onrender.com/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
        if(res.success){
            localStorage.setItem("user", JSON.stringify(res.user));
            // User role check karke redirect
            window.location.href = res.user.role === "admin" ? "admin.html" : "view.html";
        } else {
            alert("Invalid Credentials. Please try again.");
            btn.innerText = "Sign In";
            btn.disabled = false;
        }
    })
    .catch(err => {
        console.error("Login Error:", err);
        alert("Server connection failed!");
        btn.innerText = "Sign In";
        btn.disabled = false;
    });
});
</script>

</body>
</html>
